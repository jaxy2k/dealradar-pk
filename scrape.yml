name: Scrape Deals

on:
  schedule:
    - cron: "*/30 * * * *"  # Every 30 minutes
  workflow_dispatch:  # Manual trigger
  permissions:
    contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: python3 scraper.py

      - name: Copy to docs/ for GitHub Pages
        run: |
          mkdir -p docs
          cp live_deals.json docs/ 2>/dev/null || cp deals.json docs/live_deals.json
          cp index.html app.js styles.css sw.js manifest.json docs/
          cp *.png docs/ 2>/dev/null || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/live_deals.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto-scrape: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
