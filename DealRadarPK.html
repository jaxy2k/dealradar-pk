<title>DealRadar PK — never miss a discount</title>
<style>
/* ===== DEALRADAR PK — DESIGN SYSTEM v7 ===== */
:root{
  --bg:#08090d; --surface:#101218; --card:#151821; --card2:#1a1e2a; --card3:#20253a;
  --line:#232838; --line2:#2d3348;
  --txt:#f2f4f8; --txt2:#c8cdd8; --mut:#7a8299; --mut2:#5a6178;
  --accent:#22c55e; --accent2:#3b82f6; --accent3:#8b5cf6;
  --hot:#f97316; --warn:#f59e0b; --danger:#ef4444; --success:#10b981;
  --grad-main:linear-gradient(135deg,#22c55e,#16a34a);
  --grad-blue:linear-gradient(135deg,#3b82f6,#2563eb);
  --grad-purple:linear-gradient(135deg,#8b5cf6,#7c3aed);
  --grad-hot:linear-gradient(135deg,#f97316,#ef4444);
  --grad-gold:linear-gradient(135deg,#f59e0b,#d97706);
  --radius:18px; --radius-sm:12px; --radius-xs:8px;
  --glass:rgba(16,18,24,.92);
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 8px 32px rgba(0,0,0,.5);
  --shadow-glow:0 0 24px rgba(34,197,94,.15);
  --shadow-glow-blue:0 0 24px rgba(59,130,246,.15);
  --shadow-glow-purple:0 0 24px rgba(139,92,246,.15);
  --transition:all .2s cubic-bezier(.4,0,.2,1);
  --spring:all .35s cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:15px;line-height:1.5;max-width:430px;margin-inline:auto;padding-bottom:88px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent2);text-decoration:none}
.hidden{display:none!important}

/* ===== SKELETON LOADING ===== */
.skeleton{animation:shimmer 1.4s infinite;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;border-radius:var(--radius-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===== TOP BAR ===== */
.topbar{position:sticky;top:0;z-index:45;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 10px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.4);
  border-bottom:1px solid rgba(35,40,56,.6);gap:8px}
.back-btn{flex:0 0 auto;width:34px;height:34px;border-radius:10px;
  background:var(--card2);border:1px solid var(--line);color:var(--txt);font-size:16px;cursor:pointer;
  display:none;align-items:center;justify-content:center;transition:var(--spring)}
.back-btn.visible{display:flex}
.back-btn:active{transform:scale(.85)}
.brand{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.logo{font-size:22px;filter:drop-shadow(0 0 10px rgba(34,197,94,.5))}
.topbar h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.4px}
.topbar h1 span{background:linear-gradient(135deg,var(--accent),#4ade80);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tag{margin:0;font-size:10.5px;color:var(--mut);font-weight:500;letter-spacing:.4px;text-transform:uppercase}
.bell{position:relative;background:var(--card2);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:12px;font-size:16px;cursor:pointer;transition:var(--spring)}
.bell:active{transform:scale(.88)}
.lang-btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;transition:var(--spring);margin-left:6px}
.lang-btn:active{transform:scale(.88)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:9px;font-weight:800;
  min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;
  box-shadow:0 2px 8px rgba(239,68,68,.6);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ===== SEARCH ===== */
.searchbar{display:flex;gap:8px;padding:10px 16px 4px}
.searchbar input{flex:1;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);color:var(--txt);font-size:14px;outline:none;transition:var(--transition);font-weight:500}
.searchbar input::placeholder{color:var(--mut2)}
.searchbar input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(59,130,246,.12),0 0 20px rgba(59,130,246,.08)}
.wallet-btn{flex:0 0 auto;width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:18px;cursor:pointer;transition:var(--spring)}
.wallet-btn:active{transform:scale(.9)}
.wallet-btn.on{border-color:var(--accent);background:rgba(34,197,94,.12);box-shadow:var(--shadow-glow)}

/* ===== CHIPS ===== */
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;scrollbar-width:none;
  mask-image:linear-gradient(90deg,#000 90%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--card);color:var(--mut);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:var(--transition)}
.chip:active{transform:scale(.95)}
.chip.active{background:linear-gradient(135deg,var(--accent),#16a34a);color:#fff;border-color:transparent;font-weight:700;
  box-shadow:0 2px 12px rgba(34,197,94,.35)}
.chip.cat.active{background:linear-gradient(135deg,var(--accent2),#2563eb);box-shadow:0 2px 12px rgba(59,130,246,.35)}

/* ===== WALLET PANEL ===== */
.wallet-panel{margin:6px 16px 0;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px;
  animation:slideDown .25s cubic-bezier(.4,0,.2,1)}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.wallet-panel h4{margin:0 0 4px;font-size:13px;font-weight:700}
.wallet-panel p.hint{margin:0 0 10px;font-size:11px;color:var(--mut)}
.pay-grid{display:flex;flex-wrap:wrap;gap:6px}
.pay-opt{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font-size:11.5px;font-weight:600;cursor:pointer;transition:var(--transition)}
.pay-opt:active{transform:scale(.95)}
.pay-opt.on{background:linear-gradient(135deg,var(--accent2),#2563eb);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 2px 10px rgba(59,130,246,.35)}

/* ===== BANNER ===== */
#banner{padding:10px 16px 0}
.banner-card{background:linear-gradient(135deg,rgba(249,115,22,.12),rgba(239,68,68,.06));border:1px solid rgba(249,115,22,.25);
  border-radius:14px;padding:12px 14px;font-size:12.5px;color:#fdba74;font-weight:500;line-height:1.5}
.banner-card b{color:#fff;font-weight:700}
.banner-info{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:12px;color:var(--mut)}

/* ===== SAVINGS STRIP ===== */
#savingsBar{padding:6px 16px 0}
.savings-strip{background:linear-gradient(135deg,rgba(34,197,94,.1),rgba(34,197,94,.03));
  border:1px solid rgba(34,197,94,.2);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--accent);font-weight:500}
.savings-strip b{font-weight:800}

/* ===== FEED ===== */
.feed{padding:12px 16px;display:flex;flex-direction:column;gap:12px}

/* ===== DEAL CARD ===== */
.deal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative;
  transition:var(--transition);box-shadow:var(--shadow-sm)}
.deal:active{transform:scale(.98);box-shadow:var(--shadow-md)}
.deal.match{border-color:rgba(34,197,94,.35);box-shadow:0 0 0 1px rgba(34,197,94,.12),var(--shadow-sm)}
.deal.urgent{border-color:rgba(239,68,68,.4);box-shadow:0 0 0 1px rgba(239,68,68,.15),var(--shadow-sm)}
.deal.urgent::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--danger),var(--hot));animation:urgentPulse 2s infinite}
@keyframes urgentPulse{0%,100%{opacity:1}50%{opacity:.5}}
.deal-visual{height:4px;border-radius:0}

.deal-top{display:flex;gap:11px;padding:13px 13px 9px}
.logo-badge{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#fff;font-size:13px;letter-spacing:-.5px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.logo-badge::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent);pointer-events:none}
.logo-img{width:100%;height:100%;object-fit:contain;padding:5px;border-radius:inherit}
.logo-badge.sm .logo-img{padding:3px}
.deal-body{flex:1;min-width:0}
.deal-title{margin:0 0 3px;font-size:13.5px;font-weight:700;line-height:1.35;letter-spacing:-.2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.deal-brand{font-size:11px;color:var(--mut);margin:0 0 7px;display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-weight:500}
.deal-brand .dot{opacity:.3}
.vbadge{font-size:9px;background:rgba(34,197,94,.1);color:var(--accent);border:1px solid rgba(34,197,94,.2);border-radius:5px;padding:2px 6px;font-weight:700;letter-spacing:.3px}
.vbadge.unv{background:rgba(245,158,11,.08);color:var(--warn);border-color:rgba(245,158,11,.2)}
.matchflag{color:var(--accent);font-weight:700;font-size:10.5px}

.disc-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.disc{display:inline-block;background:linear-gradient(135deg,rgba(34,197,94,.14),rgba(34,197,94,.04));
  color:var(--accent);border:1px solid rgba(34,197,94,.28);padding:4px 9px;border-radius:9px;font-weight:800;font-size:13px;letter-spacing:-.3px}
.disc.cap{background:rgba(245,158,11,.08);color:var(--warn);border-color:rgba(245,158,11,.22);font-weight:600;font-size:11px}
.heat{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:var(--hot);
  background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.22);padding:4px 8px;border-radius:9px}

.deal-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.pill{font-size:10px;color:var(--mut);background:var(--card2);border:1px solid var(--line);
  padding:3px 7px;border-radius:7px;font-weight:500}
.pill.count{color:var(--warn);border-color:rgba(245,158,11,.25);background:rgba(245,158,11,.05)}
.pill.count.red{color:var(--danger);border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.05);font-weight:700}
.pill.src-social{color:#a78bfa;border-color:rgba(167,139,250,.2);background:rgba(167,139,250,.05)}
.pill.src-community{color:#67e8f9;border-color:rgba(103,232,249,.2);background:rgba(103,232,249,.05)}
.pill.trust{color:var(--accent);border-color:rgba(34,197,94,.2);background:rgba(34,197,94,.05);font-weight:700}

/* urgency progress bar */
.urgency-bar{height:3px;margin:0 13px;border-radius:2px;background:var(--card2);overflow:hidden}
.urgency-bar .fill{height:100%;border-radius:2px;transition:width .5s ease}

.deal-actions{display:flex;border-top:1px solid var(--line)}
.deal-actions button{flex:1;background:none;border:none;color:var(--mut);padding:10px 4px;font-size:10.5px;font-weight:600;cursor:pointer;transition:var(--transition)}
.deal-actions button:active{background:var(--card2);color:var(--txt)}
.deal-actions button+button{border-left:1px solid var(--line)}
.deal-actions button.voted{color:var(--accent)}

.empty{text-align:center;color:var(--mut);padding:48px 24px;font-size:13.5px;line-height:1.7}

/* ===== MERCHANT GROUPING ===== */
.merchant-group{margin-bottom:2px}
.merchant-header{display:flex;align-items:center;gap:8px;padding:6px 0 5px}
.logo-badge.sm{width:30px;height:30px;font-size:10px;border-radius:9px}
.merchant-name{font-size:13px;font-weight:700}
.merchant-count{font-size:10.5px;color:var(--mut)}
.merchant-compare{margin-left:auto;padding:5px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--card2);color:var(--accent2);font-size:10.5px;font-weight:600;cursor:pointer;transition:var(--transition)}
.merchant-compare:active{transform:scale(.95)}
.merchant-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;
  mask-image:linear-gradient(90deg,#000 88%,transparent)}
.merchant-scroll::-webkit-scrollbar{display:none}
.merchant-scroll .deal{min-width:84%;flex:0 0 84%}

/* ===== TAB BAR ===== */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:35;
  display:flex;background:var(--glass);backdrop-filter:blur(24px) saturate(1.4);border-top:1px solid rgba(35,40,56,.6);
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;background:none;border:none;color:var(--mut2);font-size:9px;font-weight:700;padding:8px 2px 10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:var(--transition);position:relative;letter-spacing:.3px}
.tab span{font-size:18px;transition:var(--spring)}
.tab.active{color:var(--accent)}
.tab.active span{transform:scale(1.15) translateY(-1px)}
.tab.active::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2.5px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent),#4ade80)}

/* ===== FAB ===== */
.fab{position:fixed;right:calc(50% - 199px);bottom:80px;z-index:36;width:52px;height:52px;border-radius:16px;
  background:linear-gradient(135deg,var(--accent),#16a34a);color:#fff;border:none;font-size:22px;font-weight:700;
  box-shadow:0 6px 24px rgba(34,197,94,.45);cursor:pointer;transition:var(--spring)}
.fab:active{transform:scale(.88)}
@media(max-width:430px){.fab{right:16px}}

/* ===== TOAST ===== */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);
  background:var(--card2);color:var(--txt);padding:12px 20px;border-radius:14px;font-size:13px;font-weight:600;
  opacity:0;transition:.25s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:60;border:1px solid var(--line2);max-width:88%;text-align:center;
  box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== SHEET ===== */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:40;backdrop-filter:blur(6px)}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;
  background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;
  z-index:50;max-height:88vh;overflow:auto;padding:8px 18px 32px;
  box-shadow:0 -12px 48px rgba(0,0,0,.6);animation:sheetUp .3s cubic-bezier(.32,.72,0,1)}
@keyframes sheetUp{from{transform:translateX(-50%) translateY(40px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.sheet .grab{width:36px;height:4px;background:var(--line2);border-radius:2px;margin:8px auto 16px}
.sheet h3{margin:0 0 8px;font-size:16px;font-weight:800;line-height:1.35;letter-spacing:-.3px}
.sheet .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.sheet .row span:first-child{color:var(--mut);flex:0 0 36%;font-weight:500}
.sheet .row span:last-child{text-align:right;font-weight:600}
.sheet ul{margin:10px 0;padding-left:18px;font-size:12px;color:var(--mut);line-height:1.7}
.sheet .fine{color:var(--mut2);font-size:10.5px;margin-top:16px;line-height:1.6;opacity:.8}
.sheet .sharebtn{display:block;width:100%;margin-top:16px;padding:14px;border-radius:14px;border:none;
  background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;
  box-shadow:0 4px 16px rgba(37,211,102,.35);transition:var(--spring);text-align:center;text-decoration:none}
.sheet .sharebtn:active{transform:scale(.96)}

/* ===== SUBMIT FORM ===== */
.form label{display:block;font-size:11px;color:var(--mut);font-weight:700;margin:14px 0 5px;letter-spacing:.4px;text-transform:uppercase}
.form input,.form select,.form textarea{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card2);color:var(--txt);font-size:13.5px;font-family:inherit;outline:none;transition:var(--transition)}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.form textarea{min-height:80px;resize:vertical}
.form .submit{width:100%;margin-top:18px;padding:14px;border-radius:14px;border:none;
  background:linear-gradient(135deg,var(--accent),#16a34a);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;
  box-shadow:0 4px 16px rgba(34,197,94,.35);transition:var(--spring)}
.form .submit:active{transform:scale(.96)}

/* ===== HERO CARD ===== */
.hero-card{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:14px;border-radius:16px;
  background:var(--card2);border:1px solid var(--line)}
.hero-info{flex:1}
.hero-brand{font-size:14.5px;font-weight:800}
.hero-type{font-size:11px;color:var(--mut);text-transform:capitalize}
.hero-disc{text-align:right}
.hero-amount{font-size:21px;font-weight:800;color:var(--accent)}
.hero-cap{font-size:10.5px;color:var(--warn)}
.sheet-summary{color:var(--mut);font-size:12.5px;margin:0 0 14px;line-height:1.65}

/* ===== SHEET ACTIONS ===== */
.sheet-actions{display:flex;gap:10px;margin-top:16px}
.sheet-actions .sharebtn{flex:1;margin-top:0}
.reportbtn{flex:0 0 auto;padding:14px 16px;border-radius:14px;border:1px solid rgba(239,68,68,.25);
  background:rgba(239,68,68,.06);color:var(--danger);font-weight:600;font-size:12.5px;cursor:pointer;transition:var(--transition)}
.reportbtn:active{transform:scale(.94)}

/* ===== COMPARE ===== */
.compare-grid{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.compare-card{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px}
.compare-disc{font-size:17px;font-weight:800;color:var(--accent);margin-bottom:4px}
.compare-title{font-size:12.5px;font-weight:600;margin-bottom:8px;line-height:1.4}
.compare-meta{display:flex;flex-wrap:wrap;gap:5px;font-size:10.5px;color:var(--mut)}
.compare-meta span{background:var(--card);border:1px solid var(--line);padding:3px 7px;border-radius:6px}
.compare-view{margin-top:10px;width:100%;padding:9px;border-radius:10px;border:1px solid var(--accent2);
  background:rgba(59,130,246,.06);color:var(--accent2);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition)}
.compare-view:active{transform:scale(.97)}

/* ===== NOTIFICATIONS ===== */
.notif-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.notif-item:last-child{border-bottom:none}
.notif-icon{font-size:15px;flex:0 0 auto}
.notif-text{font-size:12.5px;color:var(--txt);line-height:1.4}
.notif-text b{font-weight:700}

/* ===== STEPS ===== */
.steps-title{margin:16px 0 8px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.steps-list{list-style:none;margin:0;padding:0}
.steps-list li{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--txt2);line-height:1.5}
.steps-list li:last-child{border-bottom:none}
.step-num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#16a34a);
  color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* ===== ONBOARDING ===== */
body.onboarding .sheet{max-height:100vh;height:100vh;height:100dvh;border-radius:0;padding:0;overflow:hidden;animation:none}
body.onboarding .sheet .grab{display:none}
body.onboarding .sheet-backdrop{background:rgba(0,0,0,.92)}
.onboard-full{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
.ob-bg{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(600px 380px at 10% -5%,rgba(34,197,94,.22),transparent 60%),
    radial-gradient(500px 350px at 95% 10%,rgba(59,130,246,.18),transparent 55%),
    radial-gradient(550px 420px at 50% 115%,rgba(139,92,246,.12),transparent 55%),
    var(--bg)}
.ob-bg::after{content:'';position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:24px 24px}
.ob-content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:56px 28px 24px;animation:obIn .5s cubic-bezier(.22,1,.36,1) both}
@keyframes obIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.ob-visual{position:relative;width:128px;height:128px;border-radius:36px;display:flex;align-items:center;justify-content:center;
  font-size:56px;margin-bottom:32px;
  background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.ob-visual::before{content:'';position:absolute;inset:-14px;border-radius:46px;
  border:1.5px dashed rgba(34,197,94,.2);animation:obSpin 28s linear infinite}
@keyframes obSpin{to{transform:rotate(360deg)}}
.ob-title{margin:0 0 14px;font-size:25px;font-weight:800;letter-spacing:-.6px;line-height:1.2;
  background:linear-gradient(92deg,#fff 30%,#a7f3d0);-webkit-background-clip:text;background-clip:text;color:transparent}
.ob-desc{margin:0;font-size:14px;line-height:1.7;color:var(--mut);max-width:310px}
.ob-footer{position:relative;z-index:1;padding:20px 24px calc(28px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,rgba(8,9,13,.6))}
.ob-dots{display:flex;justify-content:center;gap:7px;margin-bottom:20px}
.ob-dot{width:7px;height:7px;border-radius:4px;background:var(--line2);transition:.3s}
.ob-dot.active{width:22px;background:linear-gradient(90deg,var(--accent),#4ade80)}
.ob-actions{display:flex;align-items:center;gap:12px}
.ob-skip{flex:0 0 auto;padding:14px 16px;border-radius:14px;border:none;background:transparent;
  color:var(--mut);font-size:13.5px;font-weight:600;cursor:pointer;transition:var(--transition)}
.ob-skip:active{transform:scale(.94);color:var(--txt)}
.ob-next{flex:1;padding:15px 20px;border-radius:16px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#22c55e,#16a34a);color:#04150a;font-size:15px;font-weight:800;letter-spacing:.2px;
  box-shadow:0 8px 28px rgba(34,197,94,.4),inset 0 1px 0 rgba(255,255,255,.3);transition:var(--spring)}
.ob-next:active{transform:scale(.96)}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:0;height:0}

/* ===== SELECTION ===== */
::selection{background:rgba(34,197,94,.3);color:#fff}

/* ===== EXIT DIALOG ===== */
.exit-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.8);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease}
.exit-overlay.show{opacity:1;pointer-events:auto}
.exit-dialog{background:var(--card);border:1px solid var(--line2);border-radius:24px;padding:32px 24px 24px;
  width:calc(100% - 48px);max-width:340px;text-align:center;
  box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04) inset;
  transform:scale(.9) translateY(20px);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.exit-overlay.show .exit-dialog{transform:scale(1) translateY(0)}
.exit-icon{font-size:48px;margin-bottom:16px;display:block;animation:exitBounce 1.2s ease infinite}
@keyframes exitBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.exit-title{font-size:18px;font-weight:800;margin:0 0 8px;letter-spacing:-.3px;
  background:linear-gradient(135deg,#fff,#a7f3d0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.exit-desc{font-size:13px;color:var(--mut);margin:0 0 24px;line-height:1.6}
.exit-actions{display:flex;gap:10px}
.exit-stay{flex:1;padding:14px;border-radius:14px;border:none;cursor:pointer;
  background:var(--grad-main);color:#04150a;font-size:14px;font-weight:800;
  box-shadow:0 4px 20px rgba(34,197,94,.4),inset 0 1px 0 rgba(255,255,255,.25);transition:var(--spring)}
.exit-stay:active{transform:scale(.94)}
.exit-leave{flex:1;padding:14px;border-radius:14px;border:1.5px solid var(--line2);cursor:pointer;
  background:var(--card2);color:var(--mut);font-size:14px;font-weight:600;transition:var(--transition)}
.exit-leave:active{transform:scale(.94);color:var(--txt)}

/* ===== TAB COLOR THEMES ===== */
.tab[data-tab="trending"].active{color:var(--accent)}
.tab[data-tab="trending"].active::after{background:var(--grad-main)}
.tab[data-tab="foryou"].active{color:var(--accent3)}
.tab[data-tab="foryou"].active::after{background:var(--grad-purple)}
.tab[data-tab="ending"].active{color:var(--hot)}
.tab[data-tab="ending"].active::after{background:var(--grad-hot)}
.tab[data-tab="evergreen"].active{color:var(--accent2)}
.tab[data-tab="evergreen"].active::after{background:var(--grad-blue)}
.tab[data-tab="spotted"].active{color:var(--warn)}
.tab[data-tab="spotted"].active::after{background:var(--grad-gold)}

/* ===== IMPROVED BUTTONS ===== */
.deal-actions button{position:relative;overflow:hidden}
.deal-actions button::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.08),transparent 60%);opacity:0;transition:opacity .2s}
.deal-actions button:active::after{opacity:1}
.deal-actions button.voted{color:var(--accent);text-shadow:0 0 12px rgba(34,197,94,.4)}

/* ===== IMPROVED TOAST ===== */
.toast{background:var(--card);border:1px solid var(--line2);
  box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04) inset;
  backdrop-filter:blur(20px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== IMPROVED SHEET ===== */
.sheet{background:var(--surface);border:1px solid var(--line2);
  box-shadow:0 -20px 60px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.03) inset}
.sheet .grab{background:linear-gradient(90deg,var(--line2),var(--line),var(--line2));width:44px}

/* ===== IMPROVED FAB ===== */
.fab{background:var(--grad-main);border-radius:18px;
  box-shadow:0 8px 32px rgba(34,197,94,.5),0 2px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.25)}
.fab::before{content:'';position:absolute;inset:-3px;border-radius:21px;
  background:var(--grad-main);opacity:.3;filter:blur(8px);z-index:-1;transition:opacity .3s}
.fab:active::before{opacity:.6}

/* ===== IMPROVED CHIPS ===== */
.chip.active{background:var(--grad-main);box-shadow:0 3px 14px rgba(34,197,94,.4)}
.chip.cat.active{background:var(--grad-blue);box-shadow:0 3px 14px rgba(59,130,246,.4)}

/* ===== IMPROVED WALLET PANEL ===== */

function msLeft(d) { return new Date(d + "T23:59:59+05:00") - NOW; }
function daysUntil(d) { return Math.ceil(msLeft(d) / 86400000); }
function countdown(d) {
  const ms = msLeft(d);
  if (ms <= 0) return { text: t("expired"), cls: "red", ms: 0 };
  const days = Math.floor(ms / 86400000);
  if (days >= 2) return { text: t("dLeft", {n: days}), cls: days <= 3 ? "count" : "", ms };
  const hrs = Math.floor(ms / 3600000);
  const mins = Math.floor((ms % 3600000) / 60000);
  return { text: t("hLeft", {h: hrs, m: mins}), cls: "count red", ms };
}
function hoursSince(iso) { return (NOW - new Date(iso)) / 3600000; }

function computeHeat(d) {
  if (heatCache.has(d.id)) return heatCache.get(d.id);
  if (d.status === "evergreen") return 0;
  const days = Math.max(0, daysUntil(d.valid_until));
  const urgency = Math.min(1, Math.max(0, 1 - days / 30));
  const c = d.community || {};
  const rawPop = (c.votes || 0) + (c.saves || 0) + (c.worked || 0);
  const popularity = Math.min(1, rawPop / 800);
  const wf = c.worked || 0, ff = c.failed || 0;
  const trust = (wf + ff ? wf / (wf + ff) : 0.5) * (d.confidence || 0.5);
  const recency = Math.min(1, Math.max(0, 1 - hoursSince(d.source?.captured_at || NOW.toISOString()) / 168));
  return Math.round(100 * (0.40 * urgency + 0.25 * popularity + 0.20 * trust + 0.15 * recency));
}

  deals.forEach(d => { worked += d.community?.worked || 0; failed += d.community?.failed || 0; });
  const total = worked + failed;
  return total ? Math.round((worked / total) * 100) : null;
}

  const elig = d.eligibility?.payment || [];
  if (elig.includes("any")) return true;
  return [...state.myPay].some(p => elig.includes(p));
}
function isMine(d) { return state.myPay.size > 0 && payMatch(d); }
function isHidden(d) { return (d.community?.reports_expired || 0) >= 3; }

function baseFilter(d) {
  if (isHidden(d)) return false;
  if (!cityMatch(d)) return false;
  if (state.cat !== "all" && d.category !== state.cat) return false;
  const q = state.q.trim().toLowerCase();
  if (q) {
    const hay = (d.title + " " + d.summary + " " + brandOf(d.brand).name + " " + d.cities.join(" ") + " " + d.category).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function tabDeals() {
  const all = DATA.deals.filter(baseFilter);
  const byHeat = a => a.sort((x, y) => computeHeat(y) - computeHeat(x));
  switch (state.tab) {
    case "trending": return byHeat(all.filter(d => d.status !== "evergreen" && d.status !== "spotted"));
    case "foryou": return byHeat(all.filter(d => isMine(d) && d.status !== "evergreen"));
    case "ending": return all.filter(d => d.status !== "evergreen" && daysUntil(d.valid_until) >= 0 && daysUntil(d.valid_until) <= 3)
      .sort((a, b) => new Date(a.valid_until) - new Date(b.valid_until));
    case "evergreen": return all.filter(d => d.status === "evergreen").sort((a, b) => (b.community?.worked || 0) - (a.community?.worked || 0));
    case "spotted": return all.filter(d => d.status === "spotted").sort((a, b) => (b.community?.votes || 0) - (a.community?.votes || 0));
  }
  return all;
}

// ---- merchant grouping ----
function groupByMerchant(deals) {
  const groups = {};
  deals.forEach(d => {
    const key = d.brand;
    if (!groups[key]) groups[key] = [];
    groups[key].push(d);
  });
  return groups;
}

// ---- notifications ----
function addNotification(msg) {
  state.notifications.unshift({ msg, time: NOW.toISOString(), read: false });
  if (state.notifications.length > 20) state.notifications.pop();
  store.set("dr_notifs", JSON.stringify(state.notifications));
  renderBell();
}

// ---- deal card ----
function dealCard(d) {
  const b = brandOf(d.brand);
  const initials = b.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  const cd = countdown(d.valid_until);
  const heat = computeHeat(d);
  const mine = isMine(d);
  const urgent = daysUntil(d.valid_until) >= 0 && daysUntil(d.valid_until) < 1;
  const cap = d.discount?.cap ? `<span class="disc cap">cap Rs ${Number(d.discount.cap).toLocaleString()}</span>` : "";
  const minSpend = d.eligibility?.min_spend ? `<span class="pill count">${t("minSpend", {n: Number(d.eligibility.min_spend).toLocaleString()})}</span>` : "";
  const v = d.verification === "verified"
    ? `<span class="vbadge">${t("verified")}</span>` : `<span class="vbadge unv">${t("unverified")}</span>`;
  let srcPill;
  if (d.source?.type === "social") srcPill = `<span class="pill src-social">${t("viaSocial", {p: d.source.platform})}</span>`;
  else if (d.source?.type === "community") srcPill = `<span class="pill src-community">👀 ${d.community?.spotted_by || "community"}</span>`;
  else srcPill = `<span class="pill">${t("officialPage")}</span>`;
  const heatEl = heat > 0 ? `<span class="heat">🔥 ${heat}</span>` : "";
  const voted = state.voted.has(d.id);
  const voteCount = (d.community?.votes || 0) + (voted ? 1 : 0);
  const saved = state.saved.has(d.id);
  const trust = merchantTrust(d.brand);
  const trustEl = trust !== null ? `<span class="pill trust">${t("workedRate", {n: trust})}</span>` : "";

  // Logo: real image if available, else initials
  const logoHtml = b.logo
    ? `<div class="logo-badge" style="background:${b.color}"><img src="${b.logo}" alt="${b.name}" class="logo-img" loading="lazy"></div>`
    : `<div class="logo-badge" style="background:${b.color}">${initials}</div>`;

  let urgencyBar = "";
  if (d.status !== "evergreen") {
    const total = new Date(d.valid_until + "T23:59:59+05:00") - new Date(d.valid_from + "T00:00:00+05:00");
    const elapsed = NOW - new Date(d.valid_from + "T00:00:00+05:00");
    const pct = Math.min(100, Math.max(4, Math.round((elapsed / total) * 100)));
    const color = pct > 85 ? "var(--danger)" : pct > 60 ? "var(--warn)" : "var(--accent)";
    urgencyBar = `<div class="urgency-bar"><div class="fill" style="width:${pct}%;background:${color}"></div></div>`;
  }

  const grad = d.visual?.gradient || ["#6b7280", "#d1d5db"];
  return `<article class="deal${mine ? " match" : ""}${urgent ? " urgent" : ""}" data-id="${d.id}">
    <div class="deal-visual" style="background:linear-gradient(135deg,${grad[0]}22,${grad[1]}11);border-bottom:1px solid ${grad[0]}33"></div>
    <div class="deal-top">
      ${logoHtml}
      <div class="deal-body">
        <h3 class="deal-title">${esc(d.title)}</h3>
        <p class="deal-brand">${esc(b.name)}<span class="dot">·</span>${esc(t(catKey[d.category] || "all"))} ${v} ${mine ? '<span class="matchflag">· your card</span>' : ""}</p>
        <div class="disc-row"><span class="disc">${discountLabel(d.discount)}</span>${cap}${heatEl}</div>
        <div class="deal-meta">
          <span class="pill ${cd.cls}" data-countdown="${d.id}">${cd.text}${d.status === "evergreen" ? " · " + t("ongoing") : ""}</span>
          ${minSpend}
          <span class="pill">👍 ${d.community?.worked || 0} · 👎 ${d.community?.failed || 0}</span>
          <span class="pill">▲ ${voteCount}</span>
          ${trustEl}
          ${srcPill}
        </div>
      </div>
    </div>
    ${urgencyBar}
    <div class="deal-actions">
      <button data-act="details">${t("details")}</button>
      <button data-act="vote" class="${voted ? "voted" : ""}">${voted ? "▲ " + t("voted") : "▲ " + t("hot")}</button>
      <button data-act="worked">✓ ${t("worked")}</button>
      <button data-act="save" class="${saved ? "voted" : ""}">${saved ? "🔔 " + t("saved") : "🔔 " + t("alert")}</button>
      <button data-act="share">↗ ${t("share")}</button>
    </div>
  </article>`;
}

function renderFeed() {
  const list = tabDeals();
  if (!list.length) {
    const emptyMsgs = {
      foryou: state.myPay.size ? t("emptyForYouSet") : t("emptyForYou"),
      ending: t("emptyEnding"),
      evergreen: t("emptyEvergreen"),
      spotted: t("emptySpotted"),
      trending: t("emptyTrending")
    };
    const icons = { foryou: "🎯", ending: "⏳", evergreen: "♾️", spotted: "👀", trending: "🔥" };
    $("#feed").innerHTML = `<div class="empty"><div style="font-size:40px;margin-bottom:12px">${icons[state.tab] || "📡"}</div>${emptyMsgs[state.tab] || "No deals match your filters."}</div>`;
    return;
  }
  // Show skeleton briefly for perceived performance
  if (!state.feedRendered) {
    state.feedRendered = true;
    $("#feed").innerHTML = Array(4).fill(`<div class="skeleton" style="height:140px;border-radius:var(--radius)"></div>`).join("");
    setTimeout(() => { renderFeedContent(list); }, 150);
    return;
  }
  renderFeedContent(list);
}

function renderFeedContent(list) {
  try {
  // Group by merchant when 2+ deals from same brand
  const groups = groupByMerchant(list);
  let html = "";
  const rendered = new Set();
  for (const [brandId, deals] of Object.entries(groups)) {
    if (rendered.has(brandId)) continue;
    rendered.add(brandId);
    if (deals.length >= 2 && state.tab !== "evergreen") {
      const b = brandOf(brandId);
      const groupLogo = b.logo
        ? `<div class="logo-badge sm" style="background:${b.color}"><img src="${b.logo}" alt="${b.name}" class="logo-img" loading="lazy"></div>`
        : `<div class="logo-badge sm" style="background:${b.color}">${b.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase()}</div>`;
      html += `<div class="merchant-group" data-brand="${brandId}">
        <div class="merchant-header">
          ${groupLogo}
          <span class="merchant-name">${b.name}</span>
          <span class="merchant-count">${t("activeDeals", {n: deals.length})}</span>
          <button class="merchant-compare" data-compare="${brandId}">${t("compare")}</button>
        </div>
        <div class="merchant-scroll">${deals.map(dealCard).join("")}</div>
      </div>`;
    } else {
      html += deals.map(dealCard).join("");
    }
  }
  $("#feed").innerHTML = html;
  } catch (err) {
    console.error("Feed render error:", err);
    $("#feed").innerHTML = `<div class="empty"><div style="font-size:40px;margin-bottom:12px">⚠️</div>Something went wrong loading deals.<br><button onclick="location.reload()" style="margin-top:12px;padding:10px 20px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer">Retry</button></div>`;
  }
}

function renderBanner() {
  const tabInfo = TABS[state.tab];

    const soon = DATA.deals.filter(d => d.status !== "evergreen" && !isHidden(d) && daysUntil(d.valid_until) >= 0 && daysUntil(d.valid_until) <= 2);

function renderChips() {

// ---- live ticking countdown ----
function startTicking() {
  if (tickInterval) clearInterval(tickInterval);
  tickInterval = setInterval(() => {
    if (!DATA.meta?.now) NOW = new Date();
    heatCache.clear();
    $$("[data-countdown]").forEach(el => {
      const id = el.dataset.countdown;
      const d = DATA.deals.find(x => x.id === id);
      if (!d || d.status === "evergreen") return;
      const cd = countdown(d.valid_until);
      el.textContent = cd.text;
      el.className = `pill ${cd.cls}`;
    });
  }, 60000); // tick every minute
}

  renderBell();
  $$("#sheet [data-notif-deal]").forEach(el => el.addEventListener("click", () => {
    const d = DATA.deals.find(x => x.id === el.dataset.notifDeal);
    if (d) openDeal(d);
  }));
}

// ---- onboarding (pro redesign) ----
function showOnboarding() {
  if (state.onboarded) return;
  document.body.classList.add("onboarding");
  const screens = [
    {
      icon: "🛰️",
      title: t("obTitle1"),
      desc: t("obDesc1"),
      visual: "trending"
    },
    {
      icon: "🎯",
      title: t("obTitle2"),
      desc: t("obDesc2"),
      visual: "personal"
    },
    {
      icon: "👥",
      title: t("obTitle3"),
      desc: t("obDesc3"),
      visual: "community"
    }
  ];
  let current = 0;

  function renderScreen() {
    const s = screens[current];
    const dots = screens.map((_, i) => `<span class="ob-dot${i === current ? " active" : ""}"></span>`).join("");
    $("#sheet").innerHTML = `
    <div class="onboard-full">
      <div class="ob-bg"></div>
      <div class="ob-content">
        <div class="ob-visual">${s.icon}</div>
        <h2 class="ob-title">${s.title}</h2>
        <p class="ob-desc">${s.desc}</p>
      </div>
      <div class="ob-footer">
        <div class="ob-dots">${dots}</div>
        <div class="ob-actions">
          ${current > 0 ? `<button class="ob-skip" id="obBack">${t("back")}</button>` : `<button class="ob-skip" id="obSkip">${t("skip")}</button>`}
          <button class="ob-next" id="obNext">${current === screens.length - 1 ? t("getStarted") : t("next")}</button>
        </div>
      </div>
    </div>`;

    // wire
    const next = $("#obNext");
    const back = $("#obBack");
    const skip = $("#obSkip");
    next.addEventListener("click", () => {
      if (current < screens.length - 1) { current++; renderScreen(); }
      else { finishOnboarding(); }
    });
    if (back) back.addEventListener("click", () => { current--; renderScreen(); });
    if (skip) skip.addEventListener("click", finishOnboarding);
  }

  function finishOnboarding() {
    state.onboarded = true;
    store.set("dr_onboarded", "true");
    document.body.classList.remove("onboarding");
    closeSheet();
    $("#walletPanel").classList.remove("hidden");
    renderWalletPanel();
  }

  renderScreen();
  showSheet();
}

// ---- sheet helpers ----
function showSheet() { $("#sheet").classList.remove("hidden"); $("#sheetBackdrop").classList.remove("hidden"); }
function closeSheet() { $("#sheet").classList.add("hidden"); $("#sheetBackdrop").classList.add("hidden"); }

let toastT;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2200); }

function shareDeal(d) {
  const txt = `🔥 ${d.title}\n${discountLabel(d.discount)}${d.discount?.cap ? " (cap Rs " + d.discount.cap + ")" : ""}\nValid till ${d.valid_until}\n${d.summary}\n\nvia DealRadar PK`;
  if (navigator.share) {
    navigator.share({ title: d.title, text: txt }).catch(() => {});
  } else {
    window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank");
  }
}

function syncTabs() {
  const icons = { trending: "🔥", foryou: "🎯", ending: "⏳", evergreen: "♾️", spotted: "👀" };
  $("#tabbar").innerHTML = Object.keys(TABS).map(k =>
    `<button class="tab${state.tab === k ? " active" : ""}" data-tab="${k}"><span>${icons[k]}</span>${t(k)}</button>`
  ).join("");
}

function wire() {
  $("#backBtn").addEventListener("click", goBack);
  $("#exitStay").addEventListener("click", hideExitDialog);
  $("#exitLeave").addEventListener("click", () => {
    hideExitDialog();
    if (window.AndroidBridge) { window.AndroidBridge.exitApp(); }
    else { window.close(); }
  });
  let searchTimeout;
  $("#q").addEventListener("input", e => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => { state.q = e.target.value; renderFeed(); updateBackBtn(); }, 300);
  });
  $("#cityChips").addEventListener("click", e => { const b = e.target.closest("[data-city]"); if (!b) return; state.city = b.dataset.city; renderChips(); renderFeed(); updateBackBtn(); });
  $("#catChips").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (!b) return; state.cat = b.dataset.cat; renderChips(); renderFeed(); updateBackBtn(); });
  $("#walletBtn").addEventListener("click", () => {
    const wp = $("#walletPanel");
    if (wp.classList.contains("hidden")) { wp.classList.remove("hidden"); pushNav("wallet"); }
    else { wp.classList.add("hidden"); popNav(); }
  });
  $("#walletPanel").addEventListener("click", e => {
    const b = e.target.closest("[data-pay]"); if (!b) return;
    const v = b.dataset.pay; state.myPay.has(v) ? state.myPay.delete(v) : state.myPay.add(v);
    store.set("dr_pay", JSON.stringify([...state.myPay])); renderWalletPanel(); renderFeed();
  });
  $("#tabbar").addEventListener("click", e => {
    const t = e.target.closest("[data-tab]"); if (!t) return;
    state.tab = t.dataset.tab; state.feedRendered = false; syncTabs(); updateBackBtn();
    const feed = $("#feed");
    feed.style.opacity = "0"; feed.style.transform = "translateY(8px)";
    setTimeout(() => { renderAll(); feed.style.transition = "opacity .25s ease, transform .25s ease"; feed.style.opacity = "1"; feed.style.transform = "none"; }, 120);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("#fab").addEventListener("click", openSubmit);
  $("#alertBell").addEventListener("click", openNotifications);
  $("#langBtn").addEventListener("click", () => { toggleLang(); $("#langBtn").textContent = t("langToggle"); });
  $("#feed").addEventListener("click", e => {
    // compare button
    const cmp = e.target.closest("[data-compare]");
    if (cmp) { openCompare(cmp.dataset.compare); return; }
    const card = e.target.closest(".deal"); if (!card) return;
    const d = DATA.deals.find(x => x.id === card.dataset.id); if (!d) return;
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act === "details" || !act) return openDeal(d);
    if (act === "vote") {
      if (state.voted.has(d.id)) { state.voted.delete(d.id); }
      else { state.voted.add(d.id); toast(t("hotToast")); }
      store.set("dr_voted", JSON.stringify([...state.voted]));
    }
    if (act === "worked") {
      d.community.worked++;
      trustCache.clear();
      // savings tracker: estimate savings from discount
      const est = d.discount?.kind === "percent" ? Math.min(d.discount.value * 20, d.discount.cap || 500) : (d.discount?.value || 100);
      state.savings += est;
      store.set("dr_savings", JSON.stringify(state.savings));
      renderSavings();
      toast(t("workedToast", {n: est}));
    }
    if (act === "save") {
      if (state.saved.has(d.id)) { state.saved.delete(d.id); toast(t("alertRemoved")); }
      else { state.saved.add(d.id); addNotification(t("notifAlert", {title: d.title})); toast(t("alertSet")); }
      store.set("dr_saved", JSON.stringify([...state.saved]));
    }
    if (act === "share") { shareDeal(d); return; }
    renderFeed(); renderBell();
  });
  $("#sheetBackdrop").addEventListener("click", closeSheet);
}

// ---- LIVE DATA REFRESH ----
let lastFetch = null;
let refreshInterval = null;
let isRefreshing = false;

async function fetchLive(silent = false) {
  if (isRefreshing) return;
  isRefreshing = true;
  try {
    const base = API_URL || "";
    let fresh = null;
    for (const path of [`${base}/api/deals`, `${base}/live_deals.json`]) {
      try {
        const r = await fetch(path);
        if (!r.ok) continue;
        fresh = await r.json();
        break;
      } catch (e) { continue; }
    }
    if (!fresh) throw new Error("No live source");
    if (fresh.deals && fresh.deals.length) {
      // Merge: keep local community state, update deal data
      const localMap = new Map((DATA.deals || []).map(d => [d.id, d]));
      DATA.deals = fresh.deals.map(fd => {
        const local = localMap.get(fd.id);
        if (local) {
          // Preserve community votes from local state
          fd.community = { ...fd.community, ...local.community };
        }
        return fd;
      });
      DATA.brands = fresh.brands || DATA.brands;
      DATA.meta = { ...DATA.meta, ...fresh.meta };
      lastFetch = fresh.meta?.server_time || new Date().toISOString();
      NOW = DATA.meta?.now ? new Date(DATA.meta.now) : new Date();
      heatCache.clear(); trustCache.clear(); brandMap.clear();
      renderAll();
      const newCount = fresh.deals.length - (localMap.size || 0);
      if (!silent) {
        if (newCount > 0) toast(`🆕 ${newCount} new deals just dropped!`);
        else toast("✓ Deals up to date");
      }
    }
  } catch (e) {
    console.warn("Live refresh failed:", e.message);
  }
  isRefreshing = false;
}

function setupLiveRefresh() {
  // Auto-refresh every 5 minutes
  refreshInterval = setInterval(fetchLive, 300000);

  // Pull-to-refresh
  let startY = 0, pulling = false;
  const feed = $("#feed");
  document.addEventListener("touchstart", e => {
    if (window.scrollY === 0) { startY = e.touches[0].clientY; pulling = true; }
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 80 && window.scrollY === 0) {
      pulling = false;
      toast("⟳ Refreshing deals…");
      fetchLive();
    }
  }, { passive: true });
  document.addEventListener("touchend", () => { pulling = false; }, { passive: true });
}


(async function init() {
  try {
    // Register service worker for offline + push
    if ("serviceWorker" in navigator) {
      Promise.resolve();
    }
    if (window.__DEALS__) { DATA = window.__DEALS__; }
    else {
      const r = await fetch("deals.json");
      if (!r.ok) throw new Error("Failed to load deals");
      DATA = await r.json();
    }
    NOW = DATA.meta?.now ? new Date(DATA.meta.now) : NOW;
    document.documentElement.dir = LANG === "ur" ? "rtl" : "ltr";
    document.documentElement.lang = LANG;
    $("#langBtn").textContent = t("langToggle");
    renderWalletPanel(); syncTabs(); renderAll(); wire(); startTicking();
    setupLiveRefresh();
    showOnboarding();
  } catch (err) {
    console.error("DealRadar init error:", err);
    $("#feed").innerHTML = `<div class="empty"><div style="font-size:40px;margin-bottom:12px">📡</div>Something went wrong loading deals.<br><button onclick="location.reload()" style="margin-top:12px;padding:10px 20px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer">Retry</button></div>`;
  }
})();

</script>
