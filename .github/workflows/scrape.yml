name: "Scrape Deals"

"on":
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: |
          mkdir -p data
          python3 scraper.py
        timeout-minutes: 10

      - name: Copy to root for GitHub Pages
        run: |
          cp data/live_deals.json live_deals.json
          cp data/health.json health.json 2>/dev/null || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_deals.json data/health.json live_deals.json health.json 2>/dev/null || true
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto-scrape: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
